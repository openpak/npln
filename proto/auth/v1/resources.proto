syntax = "proto3";

package nn.npln.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "openpak/splatoon-3/proto/auth/v1;auth";

message Account {
  string name = 1;

  bool banned = 2;

  google.protobuf.Timestamp update_time = 3;
}

message AccountExternalId {
  string name = 1;

  ExternalId external_id = 2;
}

message User {
  string name = 1;

  string account = 2;

  google.protobuf.Timestamp create_time = 3;

  google.protobuf.Timestamp last_login_time = 4;

  int64 short_id = 5;
}

message UserExternalId {
  string name = 1;

  string user = 2;

  ExternalId external_id = 3;

  google.protobuf.Timestamp token_last_issue_time = 4;
}

message ExternalId {
  ExternalIdType type = 1;

  string id = 2;
}

enum ExternalIdType {
  EXTERNAL_ID_TYPE_UNSPECIFIED = 0;

  NSA_ID = 1;

  DUMMY_EXT_ID = 2;
}
